services:
  linkledger:
    build: .
    container_name: linkledger
    restart: unless-stopped
    ports:
      - "8130:8000"
    # Accounts are created automatically on first boot; see the README's
    # "Setting up accounts" section.
    volumes:
      # Volume name kept as "patchbook_data" (this app's old name) for
      # compatibility with existing deployments.
      - patchbook_data:/data

volumes:
  patchbook_data:
